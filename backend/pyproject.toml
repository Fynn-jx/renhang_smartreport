[project]
name = "docwriting-backend"
version = "1.0.0"
description = "公文写作 AI 系统后端"
requires-python = ">=3.11,<3.13"
dependencies = [
  "fastapi==0.109.0",
  "uvicorn[standard]==0.27.0",
  "python-multipart==0.0.6",
  "sqlalchemy==2.0.25",
  "aiosqlite==0.20.0",
  "asyncpg==0.29.0",
  "psycopg2-binary==2.9.9",
  "alembic==1.13.1",
  "redis==5.0.1",
  "hiredis==2.3.2",
  "celery==5.3.6",
  "flower==2.0.1",
  "python-jose[cryptography]==3.3.0",
  "passlib[bcrypt]==1.7.4",
  "pydantic[email]==2.5.3",
  "pydantic-settings==2.1.0",
  "anthropic==0.18.1",
  "openai==1.10.0",
  "httpx==0.26.0",
  "aiohttp==3.9.1",
  "cos-python-sdk-v5==1.9.30",
  "PyPDF2==3.0.1",
  "PyMuPDF==1.24.14",
  "python-docx==1.1.0",
  "pillow==10.2.0",
  "python-magic==0.4.27",
  "python-dotenv==1.0.0",
  "loguru==0.7.2",
  "tenacity==8.2.3",
]

[tool.uv]
package = false

[tool.poetry]
name = "docwriting-backend"
version = "1.0.0"
description = "公文写作 AI 系统后端"
authors = ["Your Name <your.email@example.com>"]
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.11"
fastapi = "^0.109.0"
uvicorn = {extras = ["standard"], version = "^0.27.0"}
sqlalchemy = "^2.0.25"
asyncpg = "^0.29.0"
pydantic = "^2.5.3"
pydantic-settings = "^2.1.0"
redis = "^5.0.1"
celery = "^5.3.6"
python-jose = {extras = ["cryptography"], version = "^3.3.0"}
passlib = {extras = ["bcrypt"], version = "^1.7.4"}
anthropic = "^0.18.1"
openai = "^1.10.0"
httpx = "^0.26.0"
python-dotenv = "^1.0.0"
loguru = "^0.7.2"

[tool.poetry.group.dev.dependencies]
pytest = "^7.4.4"
pytest-asyncio = "^0.23.3"
black = "^24.1.1"
isort = "^5.13.2"
flake8 = "^7.0.0"
mypy = "^1.8.0"

[tool.black]
line-length = 100
target-version = ['py311']
include = '\.pyi?$'
extend-exclude = '''
/(
  # 默认排除
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
)/
'''

[tool.isort]
profile = "black"
line_length = 100
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
plugins = ["pydantic.mypy"]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
